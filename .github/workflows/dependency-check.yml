name: Dependency validation

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-check.yml"
      - ".github/dependabot.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # src/imprint-gen.js holds the private imprint and is gitignored, but
      # src/Imprint.ts imports it statically so Vite bundles it. This stub only
      # lets the import resolve; this build is never deployed.
      - name: Stub the private imprint module
        run: echo 'export const decryptedAES = () => undefined;' > src/imprint-gen.js

      - name: Run production build
        run: npm run build
