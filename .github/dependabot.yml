version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    labels:
      - "dependencies"
    rebase-strategy: "auto"
    groups:
      runtime-dependencies:
        patterns:
          - "three"
          - "crypto-js"
          - "html2canvas"
          - "@fontsource/*"
      build-tooling:
        patterns:
          - "vite"
          - "vite-plugin-pwa"
          - "@vitejs/*"
          - "@types/*"
